name: Latest

# Every push to main publishes the rolling Latest release with Zygor-IP-latest.zip,
# an installer that downloads this exact commit from GitHub and verifies it,
# built and checked by the assembly's shared addon workflow.
# The previous assets stay downloadable until the new installer is checked.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest
  cancel-in-progress: false

jobs:
  latest:
    uses: Syntax555/mod-playerbots-portable/.github/workflows/addon-latest.yml@main
    with:
      asset: Zygor-IP-latest.zip
      installer-name: ZygorGuidesViewerRM
      installer-path: ZygorGuidesViewerRM
      installer-short: Zygor
      installer-title: Zygor Guides Viewer
      installer-contains: ZygorGuidesViewer ZygorTalentAdvisor
